name: Portfolio build and license gateway tests
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:licensing
      - run: npx tsc --project tsconfig.spec.json --noEmit
      - run: npm run build
      - run: test -f dist/amirhosseinportforio/server/server.mjs
